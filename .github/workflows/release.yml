name: Release & CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build & typecheck
        run: pnpm build

      - name: Run Rust unit & security tests
        if: matrix.platform == 'macos-latest'
        run: cargo test --lib --test edge_cases_and_security_tests --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zastava ${{ github.ref_name }}'
          releaseBody: |
            ## Застава ${{ github.ref_name }} (переход v1.0.5 -> v1.1.3)

            ### 1. Полная переработка дизайна, верхней капсулы перехвата и навигации
            - Новый нативный интерфейс в темной инженерной палитре с пятью понятными вкладками (Защита, Чистый IP, Подписка, Проверки, Гайды) и информативным системным треем (Защита · GB · 100%).
            - Всплывающее окно перехватчика переработано в компактную полупрозрачную капсулу в верхней части экрана (под челкой macOS / Dynamic Island HUD) с нативной прозрачностью без рамок и безопасным демо-режимом песочницы.

            ### 2. Наглядная работа в блоке "Живой пульс защиты (Zero-MITM)"
            - На главном экране добавлены живые счетчики проверенных пакетов ИИ, остановленных утечек при сбоях VPN, прямого транзита для обычных сайтов (Git, npm, браузер без задержек 0 мс) и раскрывающаяся лента последних подключений в реальном времени.

            ### 3. Мгновенный перехват обрывов (<250 мс) и 12 шлюзов безопасности (по стандарту 2ip.io)
            - Детектор смены маршрута переведен на проверку локальной таблицы маршрутизации ядра (Kernel Route Fingerprint за <0.05 мс каждые 250 мс): при падении VPN активные туннели к ИИ ставятся на удержание мгновенно, без секундных задержек внешних API.
            - Аудитор расширен с 9 до 12 шлюзов: добавлены проверка обратной зоны Reverse DNS (PTR), согласованность юрисдикции DNS-резолверов с выходным IP и проверка гигиены локали/таймзоны среды (LANG/TZ).
            - Добавлен полный перехват доменов Google Cloud Code и Antigravity CLI (daily-cloudcode-pa.googleapis.com, *.aicode.googleapis.com).

            ### 4. Синхронизация часового пояса в 1 клик (Авто-TZ без смены системных часов)
            - Кнопка "Авто-TZ для ИИ" автоматически прописывает таймзону выходного сервера и локаль en_US.UTF-8 в ~/.zshenv, ~/.zshrc, настройки VS Code, Cursor, Claude Code и реестр Windows (HKCU\Environment + WM_SETTINGCHANGE).
            - Агенты и редакторы кода сразу видят время вашего VPN-сервера даже в уже открытых окнах без изменения системных часов компьютера, а фильтр блокирует закрепление санкционных таймзон.

            ### 5. Бэкап и перенос всех локальных данных Claude (~/.claude) в любую среду + глубокий сброс кэша
            - Экспорт всех проектов, истории диалогов (.jsonl), файлов долговременной памяти (MEMORY.md), планов (plans/) и скиллов в единый архив на Рабочий стол в один клик.
            - Автоматическая генерация карты проектов INDEX_SUMMARY.md и готового промта RESTORE_PROMPT.md для мгновенного развертывания контекста в Antigravity, Cursor, Windsurf, Codex или новом аккаунте Claude.
            - Обновленный сброс кэша ИИ-клиентов вычищает сетевое хранилище Network/Cookies и локальные антифрод-маркеры десктопных клиентов, гарантированно сохраняя пользовательские настройки MCP (claude_desktop_config.json) и папку ~/.claude.

            ### 6. Помощник оформления подписки, улучшенная проверка BIN карт и генератор адреса
            - Новая вкладка "Подписка": проверка совместимости BIN банковской карты (первые 6-8 цифр) со страной выходного IP и типом карты (Credit / Debit / Prepaid).
            - Встроенный генератор реальных платежных адресов безналоговых штатов США (0% Sales Tax: Делавэр, Орегон, Нью-Гэмпшир, Монтана, Аляска) для экономии 8-10% налога при оплате.
            - Интерактивный 96-часовой таймер прогрева нового аккаунта и пошаговый чеклист перед оплатой.

            ### 7. Встроенный 2-Hop шлюз "Чистый IP только для ИИ" и обновленные визуальные гайды по VPN
            - Вкладка "Чистый IP": подключение персональных ключей zastava:// (и socks5:// / http://) для маршрутизации исключительно трафика нейросетей через выделенный зарубежный сервер, пока весь остальной интернет работает напрямую.
            - Полностью переработаны гайды по настройке своего VPN: добавлен переключатель между простым визуальным режимом для новичков (Amnezia VPN в 3 клика без консоли с наглядными карточками каждого шага) и продвинутым режимом (Xray Reality через терминал).

            ### 8. Автообновление приложения в 1 клик без перехода на GitHub
            - Фоновая проверка новых версий, структурированное окно "Что изменилось" прямо в шапке программы и кнопка "Установить и перезапустить", которая сама скачивает обновление, устанавливает его в систему (.dmg на macOS, тихий инсталлятор на Windows) и перезапускает Заставу.

            ### О приложении (для новых пользователей)
            - Застава - бесплатная десктопная утилита с открытым исходным кодом для macOS и Windows, защищающая аккаунты Claude, ChatGPT и Gemini от банов при обрывах VPN и смене маршрутов.
            - Локальный фильтр Zero-MITM: соединение с нейросетью мгновенно встает на паузу (HOLD) при падении туннеля до того, как запрос уйдет с реального IP.
            - Без расшифровки TLS, без подмены сертификатов, без доступа к вашим ключам, коду или переписке.
            - Обычный трафик (Git, npm, сайты, мессенджеры) идет напрямую с нулевой задержкой.

            ### Установка
            - macOS (Apple Silicon и Intel): скачайте Zastava_1.1.3_universal.dmg и перетащите приложение в Applications.
            - Windows (x64): скачайте Zastava_1.1.3_x64-setup.exe или Zastava_1.1.3_x64_en-US.msi.
            - Автообновление: если у вас уже установлена Застава, нажмите кнопку "Обновления" в шапке программы для установки в 1 клик.

            Все установочные файлы собраны автоматически через GitHub Actions из открытого исходного кода в этом репозитории.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
