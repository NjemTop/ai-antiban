name: Release & CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build & typecheck
        run: pnpm build

      - name: Run Rust unit & security tests
        if: matrix.platform == 'macos-latest'
        run: cargo test --lib --test edge_cases_and_security_tests --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zastava ${{ github.ref_name }}'
          releaseBody: |
            ## Застава ${{ github.ref_name }}: обновление по отзывам пользователей

            Этот релиз собран по вашим сообщениям: от бага с мигающими окнами на Windows до вопроса "а вдруг пакет всё-таки улетит". Спасибо всем, кто писал.

            ### 1. Windows: больше никаких мигающих окон cmd и Terminal
            - Исправлена проблема, из-за которой на Windows 10/11 каждые несколько секунд появлялись и наслаивались окна Terminal. Все системные проверки (реестр, ipconfig, PowerShell) теперь запускаются без консольного окна.

            ### 2. Настройки и контроль над сетью
            - Новое окно настроек (шестеренка в шапке): автообновление теперь можно полностью отключить. Если оно выключено, Застава в фоне не обращается к GitHub.
            - Там же честный список всех внешних адресов, к которым обращается приложение, и чего именно туда уходит. Промпты, ключи и переписка никуда не отправляются.

            ### 3. Понятный язык и навигация
            - Убраны непонятные термины (Zero-MITM и другие). Вместо них простые формулировки: "Защита от бана ИИ", "Без чтения чатов", "Сбоев VPN отбито", "Обычные сайты".
            - Плашка в шапке больше не пишет "Трей macOS" на Windows: теперь "Системный трей".
            - Во вкладке "Проверки" рядом с проблемной проверкой появились кнопки исправления в 1 клик: закрепить IP, синхронизировать часовой пояс, открыть нужный гайд.

            ### 4. Краш-тест обрыва VPN: проверьте защиту своими глазами
            - Новая кнопка "Краш-тест обрыва VPN". Запускает поток тестовых запросов через тот же шлюз, который охраняет Claude, ChatGPT и Gemini, но не касается ваших аккаунтов и серверов ИИ.
            - Выключите VPN прямо во время теста или нажмите "Симулировать обрыв": вы увидите, за сколько миллисекунд шлюз остановил запросы.
            - Тестовые запросы не попадают в ваши счетчики "Защищено ИИ" и "Сбоев VPN отбито".

            ### 5. Несколько аккаунтов Claude Desktop с раздельными профилями
            - Переключение между профилями (рабочий, личный, запасной) в один клик. У каждого профиля свои сохраненные cookies, локальное хранилище и свой идентификатор устройства. Настройки MCP (claude_desktop_config.json) не затрагиваются.
            - К профилю можно привязать IP: при переключении Застава закрепляет нужный IP.
            - После переключения перезапустите Claude Desktop, чтобы он подхватил профиль.

            ### 6. Системный трей стал пультом управления
            - В меню трея: живая сводка (сколько запросов ИИ защищено, сколько сбоев VPN отбито), переключатели защиты браузеров и терминала, синхронизация часового пояса, быстрый бэкап Claude и запуск краш-теста, не открывая главное окно.

            ### Что осталось из версии 1.1.x
            - Живой пульс защиты, 12 проверок безопасности, Авто-TZ, бэкап и перенос данных Claude (~/.claude) в любую среду, помощник оформления подписки с проверкой BIN и генератором адреса, 2-Hop ключ "Чистый IP", обновленные гайды по VPN, автообновление в 1 клик с перезапуском.

            ### О приложении (для новых пользователей)
            - Застава это бесплатная десктопная утилита с открытым исходным кодом для macOS и Windows. Она защищает аккаунты Claude, ChatGPT и Gemini от банов при обрывах VPN и смене маршрутов.
            - Соединение с нейросетью ставится на паузу при падении туннеля до того, как запрос уйдет с реального IP.
            - Без расшифровки TLS, без подмены сертификатов, без доступа к вашим ключам, коду и переписке.
            - Обычный трафик (Git, npm, сайты, мессенджеры) идет напрямую без задержки.

            ### Установка
            - macOS (Apple Silicon и Intel): скачайте Zastava_1.2.0_universal.dmg и перетащите приложение в Applications.
            - Windows (x64): скачайте Zastava_1.2.0_x64-setup.exe или Zastava_1.2.0_x64_en-US.msi.
            - Если Застава уже установлена: нажмите "Обновления" в шапке программы, установка пройдет в 1 клик.

            Все установочные файлы собраны автоматически через GitHub Actions из открытого исходного кода в этом репозитории.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
