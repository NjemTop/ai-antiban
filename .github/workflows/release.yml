name: Release & CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build & typecheck
        run: pnpm build

      - name: Run Rust unit & security tests
        if: matrix.platform == 'macos-latest'
        run: cargo test --lib --test edge_cases_and_security_tests --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zastava ${{ github.ref_name }}'
          releaseBody: |
            ## Застава ${{ github.ref_name }} — Интеллектуальный сетевой шлюз

            Открытый локальный шлюз и монитор сетевых параметров для безопасной и бесперебойной работы с облачными платформами и ИИ-ассистентами (Claude, ChatGPT, Google Gemini).

            ### Основные возможности и обновления:
            - **Автообновление из GitHub Releases**: Проверка новых релизов в 1 клик и автоматическое скачивание/установка обновлений прямо из интерфейса и системного трея.
            - **Zero-MITM & SSRF Hardening**: Прозрачный HTTP CONNECT шлюз без расшифровки TLS/SSL, защита от SSRF, DNS Rebinding, FQDN trailing-dot обхода и перегрузки сокетов.
            - **Усиленное самовосстановление (Self-Healing)**: Автоматическое восстановление системного PAC-прокси после сна/смены VPN, очистка при сигналах завершения ОС (`SIGINT`/`SIGTERM`/`SIGHUP`), атомарное сохранение и самолечение `state.json`.
            - **Обновленный VPN и Биллинг Гайд (3 метода)**: Пошаговые инструкции по настройке голого ядра Xray + Каскада (РФ → Зарубежье), обходу белых списков через российский CDN (`VLESS + XHTTP GET Header`) и оживлению заблокированных VPS через `IPv6 + 3x-ui`.
            - **9 векторов сетевой гигиены**: Автоматическая проверка геолокации, баз DNSBL, ASN, утечек IPv6, DNS-резолверов и часового пояса.

            Бинарные сборки для macOS (.dmg) и Windows (.msi, .exe) скомпилированы через официальный GitHub Actions CI/CD pipeline из открытого исходного кода.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
