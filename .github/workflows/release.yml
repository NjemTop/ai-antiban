name: Release & CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build & typecheck
        run: pnpm build

      - name: Run Rust unit & security tests
        if: matrix.platform == 'macos-latest'
        run: cargo test --lib --test edge_cases_and_security_tests --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zastava ${{ github.ref_name }}'
          releaseBody: |
            ## Застава ${{ github.ref_name }}

            ### О приложении (для тех, кто зашел впервые)
            Застава - бесплатная десктопная утилита для macOS и Windows, которая защищает аккаунты Claude, ChatGPT и Gemini от банов при обрывах VPN и смене IP.

            Обычный kill-switch в VPN часто пропускает пакеты при переподключении, а консольные клиенты и расширения в редакторах кода могут отправлять запросы напрямую. Застава работает как локальный фильтр перед отправкой трафика к ИИ:
            - Если во время работы отвалился VPN или сменилась страна, приложение сразу ставит соединение с нейросетью на паузу до того, как запрос уйдет с реального IP.
            - Программа не расшифровывает трафик, не подменяет сертификаты и не видит ваши ключи и переписку.
            - Весь обычный трафик (сайты, git, npm, мессенджеры) идет напрямую без задержек.

            ### Что изменилось в версии 1.0.5 (по первой обратной связи от пользователей)
            - **Автоматическая защита для VS Code, Cursor и Claude Code**: раньше для защиты консольного Claude или расширения в VS Code нужно было вручную вставлять команды в терминал, и при перезапуске редактора через иконку на рабочем столе прокси сбрасывался. Теперь Застава сама прописывает локальный шлюз `127.0.0.1:8899` в настройки VS Code, Cursor, Windsurf, в конфиг `~/.claude/settings.json` и в профиль терминала `~/.zshrc`.
            - **Автоочистка настроек при выходе**: когда вы закрываете Заставу или выключаете защиту, приложение само убирает прокси из настроек VS Code и Claude Code, чтобы редакторы и терминал сразу работали напрямую без ошибок сети.
            - **Умная проверка в терминале**: в `~/.zshrc` добавлена проверка активности порта `8899`. Если Застава выключена, терминал автоматически работает напрямую.
            - **Исправлено окно учебного теста (Тест HOLD)**: тестовое окно теперь явно подписано как учебная демонстрация (чтобы тестовый турецкий IP из симуляции не путали с реальной утечкой своего VPN), а нажатие кнопок внутри теста больше не включает блокировку в основном состоянии программы.
            - **Обновлена инструкция для терминала**: из гайда убрана команда для `opencode`, которая выдавала ошибку, если эта утилита не установлена.
            - **Поддержка домена claude.com**: добавлена маршрутизация для новых адресов авторизации и API Claude Code.

            ### Установка
            - **macOS (Apple Silicon и Intel)**: скачайте файл `Zastava_1.0.5_universal.dmg` и перетащите приложение в папку Applications.
            - **Windows (x64)**: скачайте установщик `Zastava_1.0.5_x64-setup.exe` или `Zastava_1.0.5_x64_en-US.msi`.
            - Если у вас уже установлена версия 1.0.4, нажмите кнопку "Обновления" внутри приложения для автоматической установки.

            Все установочные файлы собраны автоматически через GitHub Actions из открытого исходного кода в этом репозитории.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
